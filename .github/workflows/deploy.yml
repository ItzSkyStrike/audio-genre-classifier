name: Deploy Backend to Azure Container App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # Required to push the cached image to GHCR
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true   # This tells GitHub to download the REAL model file!

      # --- 🚀 THE MINUTE-SAVER: DOCKER CACHING ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub provides this automatically!

      - name: Build and push Docker image with caching
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.workspace }}/backend
          file: ${{ github.workspace }}/backend/Dockerfile
          push: true
          tags: ghcr.io/itzskystrike/hit-predictor-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # -------------------------------------------

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.HITPREDICTORAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.HITPREDICTORAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.HITPREDICTORAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          # Notice we removed appSourcePath and dockerfilePath here! 
          # Azure no longer builds the app; it just deploys the cached one we built above.
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.HITPREDICTORAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.HITPREDICTORAPI_REGISTRY_PASSWORD }}
          imageToDeploy: ghcr.io/itzskystrike/hit-predictor-api:${{ github.sha }}
          containerAppName: hit-predictor-api
          resourceGroup: Audio-Backend
