name: Deploy Backend to Azure Container App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.HITPREDICTORAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.HITPREDICTORAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.HITPREDICTORAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: Dockerfile
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.HITPREDICTORAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.HITPREDICTORAPI_REGISTRY_PASSWORD }}
          imageToBuild: ghcr.io/itzskystrike/hit-predictor-api:${{ github.sha }}
          imageToDeploy: ghcr.io/itzskystrike/hit-predictor-api:${{ github.sha }}
          containerAppName: hit-predictor-api
          resourceGroup: Audio-Backend
